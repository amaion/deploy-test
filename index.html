<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 첫 포트폴리오</title>
  <style>
    body {
      max-width: 720px;
      margin: 80px auto;
      padding: 24px;
      font-family: sans-serif;
      line-height: 1.7;
      background: #f5f7fa;
    }
    main {
      padding: 32px;
      border-radius: 20px;
      background: white;
    }

      padding: 12px 20px;
      cursor: pointer;

</head>
<body>
  <main>
    <h1>안녕하세요. 병찬입니다.</h1>
    <p>개발 프로젝트를 소개하는 포트폴리오입니다.</p>
    <p>현재 첫 번째 버전을 배포하는 중입니다.</p>
    <button onclick="alert('첫 배포 성공!')">동작 확인</button>
  </main>
</body>
</html>
